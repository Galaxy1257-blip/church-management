services:
  # ── NestJS API ──────────────────────────────────────────────────────────────
  - type: web
    name: chms-api
    runtime: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: >-
      npm install &&
      npx prisma generate --schema schema.prisma &&
      npm run build -w @chms/shared &&
      npm run build -w @chms/db &&
      npm run build -w @chms/api
    startCommand: >-
      npx prisma migrate deploy --schema schema.prisma &&
      node apps/api/dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      # ── Database (Neon) ──────────────────────────────────────────────────────
      - key: DATABASE_URL
        sync: false
      - key: OWNER_DATABASE_URL
        sync: false
      - key: PLATFORM_DATABASE_URL
        sync: false
      # ── Redis (Render free Redis) ────────────────────────────────────────────
      - key: REDIS_URL
        fromService:
          type: redis
          name: chms-redis
          property: connectionString
      # ── Auth ─────────────────────────────────────────────────────────────────
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL
        value: 30d
      # ── URLs ─────────────────────────────────────────────────────────────────
      - key: WEB_URL
        sync: false
      # ── Platform ─────────────────────────────────────────────────────────────
      - key: PLATFORM_SIGNUP_KEY
        generateValue: true
      # ── Paystack ────────────────────────────────────────────────────────────
      - key: PAYSTACK_MODE
        value: mock
      - key: PAYSTACK_SECRET_KEY
        value: ""
      - key: PAYSTACK_PUBLIC_KEY
        value: ""
      - key: PAYSTACK_BASE_URL
        value: https://api.paystack.co
      # ── SMS ─────────────────────────────────────────────────────────────────
      - key: SMS_GATEWAY
        value: mock
      - key: SMS_WEBHOOK_SECRET
        generateValue: true
      - key: CSMS_BASE_URL
        value: https://app.mycsms.com/api
      - key: CSMS_API_TOKEN
        value: ""
      - key: CSMS_SENDER_ID
        value: ""
      - key: CSMS_VERIFIED
        value: "false"

  # ── BullMQ Worker ────────────────────────────────────────────────────────────
  - type: worker
    name: chms-worker
    runtime: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: >-
      npm install &&
      npx prisma generate --schema schema.prisma &&
      npm run build -w @chms/shared &&
      npm run build -w @chms/db &&
      npm run build -w @chms/worker
    startCommand: node apps/worker/dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: OWNER_DATABASE_URL
        sync: false
      - key: PLATFORM_DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: chms-redis
          property: connectionString
      - key: PAYSTACK_MODE
        value: mock
      - key: PAYSTACK_SECRET_KEY
        value: ""
      - key: SMS_GATEWAY
        value: mock
      - key: CSMS_BASE_URL
        value: https://app.mycsms.com/api
      - key: CSMS_API_TOKEN
        value: ""
      - key: CSMS_SENDER_ID
        value: ""
      - key: SMS_WEBHOOK_SECRET
        sync: false

  # ── Redis ────────────────────────────────────────────────────────────────────
  - type: redis
    name: chms-redis
    region: oregon
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []  # empty = only internal Render services can connect
